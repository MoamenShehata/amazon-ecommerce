syntax = "proto3";

package Amazon.Inventory;

option csharp_namespace = "Amazon.Inventory.Grpc";

service ProductService	{
	rpc HoldItemForPurchaseRequest (ProductIdRequest) returns (HoldItemForPurchaseReply);
}

message ProductIdRequest {
	string productId = 1;
}

message HoldItemForPurchaseReply {
	int32 purchaseRequestId = 1;
}