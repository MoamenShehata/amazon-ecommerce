<ng-container *ngIf="isFullStyle">
  <div class="row">
    <div *ngFor="let product of cartItems" class="col-3">
      <div class="card">
        <img
          src="{{ product.productImageUrl }}"
          class="card-img-top"
          alt="..."
          style="padding: 40px"
        />

        <h5 class="card-header">{{ product.productName }}</h5>
        <product-cart-control
          [productItemIds]="product.itemIds"
          [product]="product"
        />
      </div>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="!isFullStyle">
  <button class="nav-link" routerLink="/cart">
    Cart
    <span class="badge rounded-pill text-bg-primary">{{
      cartItemsFalttenedCount
    }}</span>
  </button>
</ng-container>
