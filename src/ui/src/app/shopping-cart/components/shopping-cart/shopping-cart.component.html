<ng-container *ngIf="isFullStyle">
  <ng-container *ngIf="cartItems.length > 0">
    <div class="mb-5">
      <cart-item-details *ngFor="let cartItem of cartItems" [cartItem]="cartItem"
        (onAllItemsRemoved)="removeProductFromCart(cartItem)" />
    </div>

    <div class="row" *ngIf="cartItems.length > 0">
      <div class="col-md-6">
        <h4>Total: ${{ totalPrice.toFixed(2) }}</h4>
      </div>
    </div>

    <div class="row" *ngIf="style !== 'checkout'">
      <button class="btn btn-primary" routerLink="/cart/checkout">
        Checkout
      </button>
    </div>
  </ng-container>

  <div *ngIf="cartItems.length === 0" class="text-center py-5">
    <h3>Your cart is empty</h3>
    <p class="text-muted">Browse our product catalog and add items to your cart.</p>
    <a routerLink="/catalog/products" class="btn btn-outline-primary mt-3">Go to Product Catalog</a>
  </div>

</ng-container>

<ng-container *ngIf="!isFullStyle">
  <button class="nav-link" routerLink="/cart">
    Cart
    <span class="badge rounded-pill text-bg-primary">
      {{ cartItemsFalttenedCount }}
    </span>
  </button>
</ng-container>
