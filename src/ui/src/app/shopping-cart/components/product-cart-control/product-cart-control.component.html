<div *ngIf="quantity === 0" class="d-flex justify-content-center">
  <button class="btn btn-success w-100" (click)="addToCart()">
    Add to cart
  </button>
</div>

<div *ngIf="quantity > 0" class="d-flex flex-column gap-2">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div class="btn-group" role="group" aria-label="Quantity controls" *ngIf="cartItem.isAvailable">
      <button type="button" class="btn btn-outline-danger" aria-label="Decrease quantity" (click)="removeProductItem()"
        [disabled]="quantity === 1">
        -
      </button>
      <button type="button" class="btn btn-outline-secondary disabled">
        {{ quantity }} in cart
      </button>
      <button type="button" class="btn btn-outline-success" aria-label="Increase quantity" (click)="addToCart()">
        +
      </button>
    </div>

    <div class="p-2" *ngIf="!cartItem.isAvailable">
      <h4 class="text-danger">This item is no longer available, you can remove it</h4>
    </div>

    <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteAllItemsForProduct()"
      aria-label="Remove all items for this product">
      Remove all
    </button>
  </div>

  <p class="small text-muted mb-0" *ngIf="cartItem.isAvailable">
    Use + to add more, - to remove one item, or remove all to clear this product.
  </p>
</div>
