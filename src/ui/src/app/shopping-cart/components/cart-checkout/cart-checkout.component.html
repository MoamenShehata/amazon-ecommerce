<shopping-cart [style]="'checkout'" />

<form [formGroup]="chellengePaymentForm" (ngSubmit)="createOrderAndChallengePayment()">
  <div class="row">
    <div class="col-6">
      <customer-profile (onDeliveryAddressSelected)="setDeliveryAddress($event)" [isReadOnly]="true"
        [displayPaymentCards]="false" />
    </div>

    <div class="col-6">
      <label class="form-label">Payment Method</label>
      <select class="form-control" formControlName="paymentMethodId">
        <option value=null disabled selected>Select</option>
        <option *ngFor="let method of paymentMethods" [value]="method.id">
          {{ method.name }}
        </option>
      </select>
    </div>
  </div>

  <div class="">
    <button class="btn btn-primary" type="submit" [disabled]="chellengePaymentForm.invalid">
      Proceed to payment
    </button>
  </div>

</form>
