<div class="mt-4">
    <div class="row justify-content-center">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Update status to Shipping started</h5>
            </div>
            <div class="card-body">

                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Company name</label>
                            <input type="text" class="form-control" formControlName="name" placeholder="Company name" />
                            <div class="invalid-feedback d-block" *ngIf="name.touched && name.invalid">
                                Company name is required.
                            </div>
                        </div>

                        <div class="col-6 mb-3">
                            <label class="form-label">Company Address</label>
                            <input type="text" class="form-control" formControlName="address"
                                placeholder="Company Address" />
                            <div class="invalid-feedback d-block" *ngIf="address.touched && address.invalid">
                                Company Address is required.
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Company Phone</label>
                            <input type="text" class="form-control" formControlName="phoneNumber"
                                placeholder="Company Phone" />
                            <div class="invalid-feedback d-block" *ngIf="phoneNumber.touched && phoneNumber.invalid">
                                Company Phone is required.
                            </div>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Company Website</label>
                            <input type="text" class="form-control" formControlName="website"
                                placeholder="Company Website" />
                            <div class="invalid-feedback d-block" *ngIf="website.touched && website.invalid">
                                Company Website is required.
                            </div>
                        </div>
                    </div>


                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
