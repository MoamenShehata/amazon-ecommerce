<div class="container p-2">
  <!-- Header with Add Button -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Products</h2>
    <button class="btn btn-success" *ngIf="isAdminUser" (click)="navigateToCreateProduct()">
      <i class="bi bi-plus"></i> Add New Product
    </button>
  </div>

  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="alert alert-info" role="alert">
    Loading products...
  </div>

  <!-- Products Grid -->
  <div class="row mt-4" *ngIf="productsPage && !isLoading">
    <ng-container *ngIf="productsPage.items && productsPage.items.length > 0">
      <div class="col-lg-3 col-md-4 col-sm-6 mb-4" *ngFor="let product of productsPage.items">
        <product-preview [product]="product" (deleted)="onProductDeleted(product)"></product-preview>
      </div>
    </ng-container>
    <div *ngIf="!productsPage.items || productsPage.items.length === 0" class="col-12">
      <div class="alert alert-warning" role="alert">No products found.</div>
    </div>
  </div>

  <!-- Pagination Controls -->
  <nav *ngIf="productsPage && productsPage.items && productsPage.items.length > 0" aria-label="Page navigation"
    class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="!hasPreviousPage">
        <button class="page-link" (click)="previousPage()" [disabled]="!hasPreviousPage">
          <i class="bi bi-chevron-left"></i> Previous
        </button>
      </li>

      <!-- Page Numbers -->
      <li class="page-item" *ngFor="let pageNum of getPageNumbers()"
        [class.active]="pageNum === pageRequest.pageNumber">
        <button class="page-link" (click)="goToPage(pageNum)" *ngIf="pageNum.toString() !== '...'">
          {{ pageNum }}
        </button>
        <span class="page-link" *ngIf="pageNum.toString() === '...'">{{
          pageNum
          }}</span>
      </li>

      <li class="page-item" [class.disabled]="!hasNextPage">
        <button class="page-link" (click)="nextPage()" [disabled]="!hasNextPage">
          Next <i class="bi bi-chevron-right"></i>
        </button>
      </li>
    </ul>

    <!-- Page Info -->
    <div class="text-center text-muted mt-3">
      <small>
        Page {{ pageRequest.pageNumber }} of
        {{ Math.ceil(productsPage.totalCount / pageRequest.pageSize) }} (Total:
        {{ productsPage.totalCount }} products)
      </small>
    </div>
  </nav>
</div>
