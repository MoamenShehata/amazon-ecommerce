<div class="card">
  <img
    src="assets/images/cubes.png"
    class="card-img-top"
    alt="..."
    style="padding: 40px"
  />
  <h5 class="card-header">{{ product.name }}</h5>
  <div class="card-body">
    <span
      class="btn btn-primary mx-2"
      *ngFor="let cat of product.categories.split(',')"
      >{{ cat }}</span
    >
  </div>
</div>
