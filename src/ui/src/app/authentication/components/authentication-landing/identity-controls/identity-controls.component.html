<ng-container *ngIf="!authenticatedUser">
  <li class="nav-item">
    <button
      class="btn btn-outline-light ms-2"
      type="button"
      (click)="startOAuthLogin()"
    >
      Login
    </button>
  </li>
</ng-container>

<ng-container *ngIf="authenticatedUser">
  <li class="nav-item">
    <span>{{ authenticatedUser.email }}</span>
  </li>

  <li class="nav-item">
    <button (click)="logout()">Logout</button>
  </li>
</ng-container>
