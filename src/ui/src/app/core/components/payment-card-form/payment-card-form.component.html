<div class="mt-4">
    <div class="row justify-content-center">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Details</h5>
            </div>
            <div class="card-body">
                <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
                <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

                <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label class="form-label">Cardholder Name</label>
                        <input type="text" class="form-control" formControlName="cardHolder"
                            placeholder="Name on card" />
                        <div class="invalid-feedback d-block"
                            *ngIf="f['cardHolder'].touched && f['cardHolder'].invalid">
                            Cardholder name is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" formControlName="cardNumber" maxlength="16"
                            placeholder="1234123412341234" />
                        <div class="invalid-feedback d-block"
                            *ngIf="f['cardNumber'].touched && f['cardNumber'].invalid">
                            Enter a valid card number (16 digits).
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Card Expiration</label>
                        <input type="month" class="form-control" formControlName="expiresAt" />
                        <div class="invalid-feedback d-block" *ngIf="f['expiresAt'].touched && f['expiresAt'].invalid">
                            Expiration month is required and must be in YYYY-MM format.
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary" type="submit"
                            [disabled]="isSubmitting || paymentForm.invalid">{{ isSubmitting ? 'Processing...' :
                            'Save Card' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
