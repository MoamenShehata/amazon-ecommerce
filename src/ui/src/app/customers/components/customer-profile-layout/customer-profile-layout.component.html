<div class="customer-profile-layout container my-4">
    <div class="row">
        <div class="col-lg-3 mb-4 mb-lg-0">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Account</h5>
                    <nav class="nav flex-column nav-pills side-tab-nav">
                        <a routerLink="profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                            class="nav-link">
                            Profile
                        </a>
                        <a routerLink="orders" routerLinkActive="active" class="nav-link">
                            Orders
                        </a>
                    </nav>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-body">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
