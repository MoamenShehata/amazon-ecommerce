<ng-container *ngIf="isReadOnly">
  <customer-shipping-addresses *ngIf="myProfile" [addresses]="myProfile.addresses" [style]="'select'"
    (onDeliveryAddressSelected)="emitOnDeliveryAddressSelected($event)" />
</ng-container>

<ng-container *ngIf="!isReadOnly">
  <customer-shipping-addresses *ngIf="myProfile" [addresses]="myProfile.addresses" [style]="'list'" />

  <customer-payment-cards *ngIf="myProfile" [paymentCards]="myProfile.paymentCards" />

</ng-container>
